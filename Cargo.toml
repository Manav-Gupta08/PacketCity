[workspace]
resolver = "2"
members = ["core", "capture", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
authors = ["Manav Gupta"]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
packetcity-core = { path = "core" }
packetcity-capture = { path = "capture" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
